openapi: 3.0.1
info:
  title: OA系统 - 公告模块 API
  description: 公告管理与展示相关的接口集合（已预设测试数据和 Header）
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发网关环境
paths:
  /api/v1/notices:
    post:
      summary: 1. 创建公告
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, example: "系统升级维护通知" }
                content: { type: string, example: "<p>今晚 24:00 进行停机维护，请提前保存工作。</p>" }
                type: { type: string, example: "MAINTENANCE" }
      responses:
        '200': { description: 请求成功 }
    get:
      summary: 5. 管理端列表查询
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: title
          in: query
          schema: { type: string, example: "维护" }
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/{id}:
    put:
      summary: 2. 更新公告
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, example: "系统升级维护通知(已修改)" }
                content: { type: string, example: "<p>维护时间延长至凌晨2点。</p>" }
      responses:
        '200': { description: 请求成功 }
    get:
      summary: 6. 管理端获取详情
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200': { description: 请求成功 }
    delete:
      summary: 7. 删除公告
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/{id}/publish:
    post:
      summary: 3. 发布公告
      description: 注意：此接口不要传递 Body 参数
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/{id}/offline:
    post:
      summary: 4. 下线公告
      tags: [管理后台接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/public:
    get:
      summary: 8. 获取已发布的公共列表
      tags: [用户端接口]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/public/{id}:
    get:
      summary: 9. 获取公告详情 (公共)
      tags: [用户端接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/{id}/read:
    post:
      summary: 10. 标记公告为已读
      tags: [用户端接口]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: 请求成功 }
  /api/v1/notices/public/unread-count:
    get:
      summary: 11. 获取未读数量
      tags: [用户端接口]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { description: 请求成功 }

components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "2079484894002016300"
      description: 公告的全局唯一 ID
    UserId:
      name: X-User-Id
      in: header
      required: false
      schema:
        type: string
        example: "10001"
      description: 模拟网关透传的用户 ID
    Permissions:
      name: X-Permissions
      in: header
      required: false
      schema:
        type: string
        example: "notice:create,notice:update,notice:delete,notice:publish,notice:offline,notice:list,notice:view"
      description: 模拟网关透传的用户权限标识