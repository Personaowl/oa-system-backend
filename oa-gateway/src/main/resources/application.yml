server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: oa-gateway
  config:
    import:
      - optional:nacos:oa-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      server:
        webflux:
          routes:
            - id: oa-user-service
              uri: lb://oa-user-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/departments/**,/api/v1/roles/**,/api/v1/permissions/**
            - id: oa-attendance-service
              uri: lb://oa-attendance-service
              predicates:
                - Path=/api/v1/attendance/**
            - id: oa-flow-service
              uri: lb://oa-flow-service
              predicates:
                - Path=/api/v1/flows/**,/api/v1/leave/**,/api/v1/overtime/**
            - id: oa-notice-service
              uri: lb://oa-notice-service
              predicates:
                - Path=/api/v1/notices/**
            - id: oa-ai-service
              uri: lb://oa-ai-service
              predicates:
                - Path=/api/v1/ai/**
            - id: oa-document-service
              uri: lb://oa-document-service
              predicates:
                - Path=/api/v1/documents/**,/api/v1/document-workspaces/**
            - id: oa-asset-service
              uri: lb://oa-asset-service
              predicates:
                - Path=/api/v1/assets/**

oa:
  security:
    jwt:
      issuer: oa-system
      secret: ${OA_JWT_SECRET:b2Etc3lzdGVtLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWtleS0yMDI2}
      access-token-ttl: 2h
  gateway:
    cors:
      allowed-origins:
        - ${FRONTEND_ORIGIN:http://localhost:5173}
        - http://127.0.0.1:5173
    security:
      public-paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/ai/**
        - /actuator/health/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
