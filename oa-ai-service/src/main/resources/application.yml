server.port: ${AI_SERVICE_PORT:8105}
spring:
  application.name: oa-ai-service
  config.import:
    - optional:nacos:oa-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
    - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud.nacos:
    discovery:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
    config:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:12434}
      chat.options.model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
      embedding.options.model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore.redis:
      initialize-schema: true
      index-name: oa-knowledge-index
      prefix: oa:knowledge:
  data.redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
