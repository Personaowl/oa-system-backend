server.port: ${AI_SERVICE_PORT:8105}
spring:
  application:
    name: oa-ai-service
  config:
    import:
      - optional:nacos:oa-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  ai:
    openai:
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${SILICONFLOW_API_KEY}
      chat:
        options:
          model: ${SILICONFLOW_CHAT_MODEL:Pro/zai-org/GLM-4.7}
      embedding:
        options:
          model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      redis:
        initialize-schema: true
        index-name: oa-knowledge-index
        prefix: oa:knowledge:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
